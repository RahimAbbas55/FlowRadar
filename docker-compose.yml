name: flowradar

services:
  api:
    image: flowradar-api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    platform: ${FLOWRADAR_PLATFORM:-linux/amd64}
    environment:
      MLFLOW_TRACKING_URI: sqlite:////state/mlflow.db
      FLOWRADAR_DATA_DIR: /app/data/default
      FLOWRADAR_CALIBRATION_DAYS: "180"
    volumes:
      - flowradar-state:/state
    ports:
      - "${FLOWRADAR_DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 240s

  dashboard:
    image: flowradar-dashboard
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    platform: ${FLOWRADAR_PLATFORM:-linux/amd64}
    environment:
      FLOWRADAR_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  flowradar-state: